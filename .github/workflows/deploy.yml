name: Deploy WorkBenchHr to WordPress

on:
  push:
    branches:
      - main # Triggers the deployment every time you push to main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          # Uploads your HTML/CSS/JS files into your site folder
          # GoDaddy is often /public_html/ — change if your host shows a different root
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/WorkBenchHR-feat-doc-generation-maanav/**
            **/.github/**
