name: Deploy WorkBenchHr to WordPress

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # GoDaddy Managed WordPress uses SFTP (port 22), NOT FTP (port 21).
      - name: Sync files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          sftp_only: true
          # Confirm this path in FileZilla after connecting — often /html/ on GoDaddy MWP
          remote_path: /html/
          local_path: ./*
          sftpArgs: "-o StrictHostKeyChecking=no"
          delete_remote_files: false
          rsyncArgs: "--exclude=.git --exclude=.github --exclude=node_modules --exclude=.DS_Store --exclude=WorkBenchHR-feat-doc-generation-maanav"
